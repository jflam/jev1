<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Smart Home · Jev</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #f6f6f4; --panel: #ffffff; --ink: #1a1a1a; --muted: #75756f; --faint: #b9b9b2;
    --line: #e7e7e2; --chip: #eeeeea; --on: #e7f7f1; --on-line: #9fdcc6; --on-ink: #0f8a63;
    --warn: #b7791f; --warn-bg: #fdf3e2; --bad: #d64545; --bad-bg: #fdeaea; --accent: #3b5bdb;
    --mono: "JetBrains Mono", ui-monospace, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121212; --panel: #1b1b1b; --ink: #ececec; --muted: #9a9a94; --faint: #55554f;
      --line: #2c2c2a; --chip: #262624; --on: #12291f; --on-line: #1f6b4f; --on-ink: #5fd3a6;
      --warn: #e0a84a; --warn-bg: #2d2413; --bad: #f07a7a; --bad-bg: #331a1a; --accent: #8ea4ff;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 Inter, system-ui, sans-serif; }
  header { padding: 16px 20px 12px; border-bottom: 1px solid var(--line); background: var(--panel); }
  form { display: flex; gap: 10px; }
  #prompt { flex: 1; min-width: 0; font: inherit; font-size: 16px; padding: 11px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); }
  select, button { font: inherit; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 0 12px; height: 44px; }
  button.primary { background: var(--ink); color: var(--panel); border-color: var(--ink); font-weight: 600; padding: 0 20px; cursor: pointer; }
  button.primary:disabled { opacity: .5; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .chip { background: var(--chip); border: 0; height: auto; padding: 6px 12px; border-radius: 8px; color: var(--muted); cursor: pointer; font-size: 13px; }
  .chip:hover { color: var(--ink); }
  main { display: grid; grid-template-columns: minmax(340px, 5fr) 7fr; min-height: calc(100vh - 150px); }
  section { background: var(--panel); }
  #home { border-right: 1px solid var(--line); }
  .bar { display: flex; align-items: center; gap: 10px; padding: 14px 20px; border-bottom: 1px solid var(--line); }
  .bar h2 { font-size: 16px; margin: 0; flex: 1; }
  .bar select, .bar button { height: 36px; }
  .room { padding: 14px 20px 4px; }
  .room h3 { margin: 0 0 10px; font-size: 15px; font-weight: 500; color: var(--muted); }
  .devices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .device { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; transition: background .3s, border-color .3s, box-shadow .3s; }
  .device .ico { font-size: 18px; filter: grayscale(1); opacity: .5; }
  .device .name { font-weight: 500; }
  .device .st { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .device .dot { margin-left: auto; width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
  .device.active { background: var(--on); border-color: var(--on-line); }
  .device.active .ico { filter: none; opacity: 1; }
  .device.active .st { color: var(--on-ink); }
  .device.active .dot { background: var(--on-ink); }
  .device.flash { box-shadow: 0 0 0 2px var(--accent); }
  .device.ctx { outline: 2px dashed var(--faint); outline-offset: 2px; }

  #trace { display: flex; flex-direction: column; min-width: 0; }
  #trace .head { padding: 14px 24px; border-bottom: 1px solid var(--line); }
  #trace .head h2 { font-size: 16px; margin: 0 0 4px; }
  .q { color: var(--muted); margin: 0; }
  .timing { font-family: var(--mono); margin-top: 4px; }
  .timing b { font-weight: 500; }
  #log { flex: 1; overflow: auto; padding: 8px 24px 24px; }
  .reply { margin: 14px 0 6px; padding: 12px 14px; border-radius: 10px; background: var(--chip); }
  .reply.ok { background: var(--on); color: var(--on-ink); }
  .reply.warn { background: var(--warn-bg); color: var(--warn); }
  .reply.bad { background: var(--bad-bg); color: var(--bad); }
  .reply button { height: 30px; margin: 8px 8px 0 0; cursor: pointer; }
  .sub { margin: 18px 0 0; padding-left: 14px; border-left: 2px solid var(--line); }
  .sub > .q { color: var(--ink); font-weight: 500; }
  .row { display: grid; grid-template-columns: 74px 1fr 54px; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); opacity: .32; transition: opacity .2s; }
  .row.used { opacity: 1; }
  .row:hover { opacity: 1; }
  .tag { align-self: start; font-family: var(--mono); font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; text-align: center; padding: 2px 0; }
  .row.used .tag { color: var(--accent); border-color: var(--accent); }
  .label { font-weight: 500; }
  .probs { font-family: var(--mono); font-size: 12px; color: var(--muted); margin-top: 3px; overflow-wrap: anywhere; }
  .probs .top { color: var(--ink); font-weight: 500; }
  .row.used .probs .top { color: var(--on-ink); }
  .conf { align-self: start; font-family: var(--mono); font-size: 12px; text-align: center; border-radius: 6px; padding: 2px 0; }
  .conf.hi { color: var(--on-ink); background: var(--on); }
  .conf.mid { color: var(--warn); background: var(--warn-bg); }
  .conf.lo { color: var(--bad); background: var(--bad-bg); }
  .foot { font-family: var(--mono); font-size: 12px; color: var(--muted); padding: 10px 0; }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
  .spin { color: var(--muted); padding: 14px 0; font-family: var(--mono); font-size: 12px; }

  @media (max-width: 860px) {
    header { padding: 12px 16px; }
    form { flex-wrap: wrap; }
    #prompt { flex-basis: 100%; }
    #ctx { flex: 1; min-width: 0; }
    main { grid-template-columns: 1fr; }
    #home { border-right: 0; border-bottom: 1px solid var(--line); }
    .bar, .room { padding-left: 16px; padding-right: 16px; }
    #trace .head, #log { padding-left: 16px; padding-right: 16px; }
    .row { grid-template-columns: 1fr 48px; }
    .row .tag { display: none; }
  }
</style>
</head>
<body>
<header>
  <form id="form">
    <input id="prompt" placeholder="Ask your home to do something…" autocomplete="off" />
    <select id="ctx" title="Which device the user is speaking to"></select>
    <button class="primary" id="send">Send</button>
  </form>
  <div class="chips" id="chips"></div>
</header>
<main>
  <section id="home">
    <div class="bar">
      <h2>Smart Home</h2>
      <select id="homeSel"></select>
      <button id="reset">Reset</button>
    </div>
    <div id="rooms"></div>
  </section>
  <section id="trace">
    <div class="head">
      <h2>Decision Trace</h2>
      <p class="q" id="traceQ">Send a request to see every judgment Jev made.</p>
      <div class="timing" id="timing"></div>
    </div>
    <div id="log"><div class="empty">One request fans out into every question the dispatcher might need.<br />Code reads only the answers that apply; the rest stay dim.</div></div>
  </section>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
